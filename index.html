<style>

.closed-eyes{display:none}.cat.shut .closed-eyes{display:inline}.cat.shut .open-eyes{display:none}
.cheek{opacity:.55;transition:opacity .15s}.cat.shut .cheek{opacity:1;fill:#ff6fae}
.o{stroke:#1b1230;stroke-width:4;stroke-linejoin:round}
.tongue{display:none}.cat.lick .tongue{display:inline}

#btn{position:relative;font:inherit;font-weight:900;font-size:clamp(28px,7vmin,56px);color:#fff;letter-spacing:.06em;cursor:pointer;

 box-shadow:inset 0 5px 0 #fff8,inset 0 -6px 0 #c8447f55,0 8px 0 #b8447c,0 14px 22px #1b0d3d99,0 0 30px #ff9ccd;text-shadow:0 3px 0 #c8447f}
#btn:active,#btn.dn{transform:translateY(6px);box-shadow:inset 0 5px 0 #fff8,0 2px 0 #b8447c,0 0 30px #ff9ccd}
.paw{font-size:clamp(24px,6vmin,46px);filter:drop-shadow(0 0 8px #ffc8e6);opacity:.9}
#hint{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));font-size:clamp(11px,2.2vmin,16px);color:#ffe2f3;opacity:.85;text-align:right;max-width:30vw;z-index:4}
@media (max-width:700px){#hint{position:static;max-width:none;margin-top:4px}#bottom{flex-wrap:wrap}.paw{display:none}#btn{padding:1.4vmin 14vw}}
@media (max-height:520px){#plaque{font-size:clamp(18px,6vmin,30px);padding:0 4vmin;border-width:2px}#score{margin-top:3px;font-size:16px;padding:0 12px}#moon{width:11vmin}#btn{font-size:24px;padding:4px 10vmin;border-width:3px}#hint{display:none}#cats{--w:min(30vw,30vh,260px)}#app{padding-top:6px;padding-bottom:8px}}
@media (max-width:700px) and (orientation:portrait){#cats{--w:min(36vw,30vh)}#moon{width:17vw}}
.treat{position:absolute;left:50%;top:0;width:clamp(56px,15vmin,110px);height:auto;image-rendering:pixelated;z-index:6;pointer-events:none;filter:drop-shadow(0 0 12px #fffa);transform:translateX(-50%);animation:tr 3.9s ease-out forwards}
@keyframes tr{0%{transform:translateX(-50%) scale(0) rotate(-25deg);opacity:0}8%{transform:translateX(-50%) scale(1.35) rotate(8deg);opacity:1}14%{transform:translateX(-50%) scale(1) rotate(0)}35%{transform:translate(-50%,-10px)}55%{transform:translate(-50%,0)}75%{transform:translate(-50%,-10px)}100%{transform:translate(-50%,-26px) scale(.5);opacity:0}}
@media (prefers-reduced-motion:reduce){.body,.tail,.ear{animation:none}}
</style>

<script>
const COL={l:{fur:'#a79bbd',f2:'#8479a0',bel:'#d9d0e8',e:'#2fb865',e2:'#a6f2b4'},r:{fur:'#2d2a3a',f2:'#1e1b29',bel:'#4a4560',e:'#2f86ff',e2:'#9fd6ff'}};
const D='#1b1230',P=q=>new Path2D(q),RAD=Math.PI/180;

 const k=COL[E.side],g=E.g,ph=E.side==='r'?1.3:0,br=Math.sin((t+ph)*2*Math.PI/3.2)*.5+.5,shut=E.el.classList.contains('shut'),lick=E.el.classList.contains('lick');
 g.clearRect(0,0,50,59);g.save();g.scale(.25,.25);g.lineJoin='round';
 g.save();g.translate(0,-32);
 rot(g,66,232,-9*(.5-.5*Math.cos((t+ph)*2*Math.PI/2.6)),()=>{g.lineCap='round';g.strokeStyle=D;g.lineWidth=22;g.stroke(pTail);g.strokeStyle=k.fur;g.lineWidth=14;g.stroke(pTail)});
 g.save();g.translate(100,255);g.scale(1+.015*br,1+.025*br);g.translate(-100,-255);
 el(g,100,214,42,40,k.fur,1);el(g,100,222,24,24,k.bel);el(g,80,252,14,9,k.f2,1);el(g,120,252,14,9,k.f2,1);g.restore();g.restore();
 g.save();g.translate(hp.x,hp.y);rot(g,100,150,hp.r,()=>{
  const tw=((t+ph*1.7)%5)>4.4?Math.sin(t*30)*7:0;
  rot(g,70,55,tw,()=>{poly(g,[42,70,46,8,98,40],k.fur,1);poly(g,[53,58,55,26,82,44],'#ffb3d1')});
  rot(g,130,55,-tw,()=>{poly(g,[158,70,154,8,102,40],k.fur,1);poly(g,[147,58,145,26,118,44],'#ffb3d1')});
  el(g,100,98,66,56,k.fur,1);g.fillStyle='#ffd96b';g.fill(pMoon);
  g.globalAlpha=shut?1:.55;el(g,46,128,12,8,shut?'#ff6fae':'#ff9cc6');el(g,154,128,12,8,shut?'#ff6fae':'#ff9cc6');g.globalAlpha=1;
  if(shut){g.lineCap='round';g.lineWidth=7;g.strokeStyle=D;g.stroke(pArcs)}

  if(lick){g.fillStyle='#ff6f9c';g.fill(pTongue);g.lineWidth=5;g.strokeStyle=D;g.stroke(pTongue)}

  g.globalAlpha=.7;g.strokeStyle='#fff';g.stroke(pWh);g.globalAlpha=1});

 const im=g.getImageData(0,0,50,59),d=im.data;for(let i=3;i<d.length;i+=4)d[i]=d[i]>=110?255:0;g.putImageData(im,0,0)}
const mk=(e,side)=>{const cv=document.createElement('canvas');cv.width=50;cv.height=59;e.appendChild(cv);return{el:e,side,g:cv.getContext('2d',{willReadFrequently:true})}};
const c1=document.getElementById('c1'),c2=document.getElementById('c2'),cats=[c1,c2],E=[mk(c1,'l'),mk(c2,'r')];
let bp=null;
function pose(){if(!bp)return{r:0,x:0,y:0};const p=(performance.now()-bp.t0)/bp.dur;if(p>=1)return{r:0,x:0,y:0};
 const K=[[0,0,0,0],[.15,-4,0,0],[.42,bp.tilt,6,8],[.65,bp.tilt*.35,2,2],[1,0,0,0]];
 for(let i=1;i<K.length;i++)if(p<=K[i][0]){const a=K[i-1],b=K[i];let u=(p-a[0])/(b[0]-a[0]);u=u*u*(3-2*u);return{r:a[1]+(b[1]-a[1])*u,x:a[2]+(b[2]-a[2])*u,y:a[3]+(b[3]-a[3])*u}}return{r:0,x:0,y:0}}
(function loop(){const t=performance.now()/1000,hp=pose();E.forEach(e=>drawCat(e,t,hp));requestAnimationFrame(loop)})();
// stars
const st=document.getElementById('stars'),sy=['✦','✧','♡','·','✦','★'];
for(let i=0;i<70;i++){const s=document.createElement('i');s.textContent=sy[i%sy.length];s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;font-size:${8+Math.random()*14}px;--d:${2+Math.random()*4}s;animation-delay:-${Math.random()*5}s`;st.appendChild(s)}
// audio

 o.type='sine';o2.type='triangle';
 if(kind===0){o.frequency.setValueAtTime(520,t);o.frequency.exponentialRampToValueAtTime(880,t+.07);o.frequency.exponentialRampToValueAtTime(700,t+.2);o2.frequency.setValueAtTime(1040,t);o2.frequency.exponentialRampToValueAtTime(1500,t+.07);var d=.22}
 else{o.frequency.setValueAtTime(230,t);o.frequency.exponentialRampToValueAtTime(420,t+.14);o.frequency.exponentialRampToValueAtTime(260,t+.42);o2.frequency.setValueAtTime(460,t);o2.frequency.exponentialRampToValueAtTime(600,t+.14);var d=.46}
 const g2=a.createGain();g2.gain.value=.15;o2.connect(g2).connect(g);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.5,t+.012);g.gain.exponentialRampToValueAtTime(.001,t+d);
 o.connect(g).connect(a.destination);o.start(t);o2.start(t);o.stop(t+d+.05);o2.stop(t+d+.05)}
try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
let sil=null;function unmute(){if(sil)return;try{const n=4000,b=new DataView(new ArrayBuffer(44+n)),w=(o,t)=>[...t].forEach((c,i)=>b.setUint8(o+i,c.charCodeAt(0)));w(0,'RIFF');b.setUint32(4,36+n,true);w(8,'WAVEfmt ');b.setUint32(16,16,true);b.setUint16(20,1,true);b.setUint16(22,1,true);b.setUint32(24,8000,true);b.setUint32(28,8000,true);b.setUint16(32,1,true);b.setUint16(34,8,true);w(36,'data');b.setUint32(40,n,true);for(let i=0;i<n;i++)b.setUint8(44+i,128);
 sil=new Audio(URL.createObjectURL(new Blob([b],{type:'audio/wav'})));sil.loop=true;sil.play().catch(()=>{sil=null})}catch(e){}}

['touchstart','touchend','pointerdown','click'].forEach(e=>addEventListener(e,unlock,{passive:true,capture:true}));
const snd=document.getElementById('snd');
snd.onclick=e=>{e.stopPropagation();on=!on;snd.textContent=on?'🔊':'🔇';if(on)ctx()};
// game
let n=0,timers=[],busy=false;
const num=document.getElementById('num'),score=document.getElementById('score');
function fx(sym,x,y){const e=document.createElement('div');e.className='fx';e.textContent=sym;e.style.left=x+'px';e.style.top=y+'px';
 e.style.setProperty('--dx',(Math.random()*120-60)+'px');e.style.setProperty('--r',(Math.random()*60-30)+'deg');document.body.appendChild(e);setTimeout(()=>e.remove(),1500)}
let pend=0,ct=0,last=0;
const PAL={o:'#1b1230',g:'#5fd16d',r:'#ff4f7a',w:'#ffffff',y:'#ffe27a',p:'#ff9cc6',c:'#fff4e6',b:'#f2c27d'};
const SP={berry:['....og','..oggg','.orggg','orrrrr','orwrrr','orrrry','orrrrr','.orryr','.orrrr','..orrr','...orr','....oo'],
 candy:['......','......','....oo','oo.opp','opoppw','oppppp','opoppp','oo.opp','....oo','......','......','......'],
 cake:['....oo','...orr','..oooo','.occcc','.opppp','.obbbb','.opppp','.obbbb','.obbbb','.ooooo','......','......']};

 SP[k].forEach((row,y)=>{[...(row+[...row].reverse().join(''))].forEach((ch,x)=>{if(PAL[ch]){g.fillStyle=PAL[ch];g.fillRect(x,y,1,1)}})});return cv}

function contact(){pend=0;cats.forEach(c=>c.classList.add('shut'));c2.classList.add('lick');sound(Math.random()<.5?0:1);

 const r=c1.getBoundingClientRect(),r2=c2.getBoundingClientRect(),cx=(r.right+r2.left)/2,cy=r.top+r.height*.2;

 if(n%40===0)treat()}

 if(pend){clearTimeout(ct);contact()}

 const w=c1.offsetWidth,dur=(fast?330:560)+Math.random()*(fast?110:200),tilt=10+Math.random()*5,lunge=w*(.145+Math.random()*.02),hop=(Math.random()*8-2);

cats.forEach(c=>c.addEventListener('pointerdown',e=>{e.preventDefault();boop()}));
// idle blinking
(function blink(){setTimeout(()=>{if(!timers.length||!cats[0].classList.contains('shut')){const b=[c1,c2].filter(()=>Math.random()<.8);
 b.forEach(c=>{if(!c.classList.contains('shut')){c.classList.add('shut');setTimeout(()=>c.classList.remove('shut'),150)}})}blink()},2200+Math.random()*2500)})();
// random sparkles
setInterval(()=>fx('✦',Math.random()*innerWidth,innerHeight*(.3+Math.random()*.4)),1800);
</script>
